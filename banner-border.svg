<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00E5">
        <animate attributeName="stop-color" values="#FF00E5;#00F0FF;#FF00E5" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FF00E5;#00F0FF" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00E5">
        <animate attributeName="stop-color" values="#FF00E5;#00F0FF;#FF00E5" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect x="10" y="10" width="680" height="240" rx="18"/>
    </clipPath>
  </defs>

  <!-- glowing animated border -->
  <rect x="10" y="10" width="680" height="240" rx="18"
        fill="none" stroke="url(#electric)" stroke-width="5"
        filter="url(#glow)"/>

  <!-- banner image clipped inside border -->
  <image href="https://raw.githubusercontent.com/AtibaYounus/AtibaYounus/main/banner.jpeg"
         x="10" y="10" width="680" height="240"
         clip-path="url(#rounded)"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- sharp inner outline for crispness -->
  <rect x="10" y="10" width="680" height="240" rx="18"
        fill="none" stroke="url(#electric)" stroke-width="2"/>
</svg>
